name: Release

# 三步骤发布：
#   1 · 检查 package.json 里的版本号，决定这次要不要发、发成什么
#   2 · 按版本号建 tag 与草稿 Release（x.y.z 正式版，x.y.z-betaN 预发布）
#   3 · 三平台构建 → 打包 → 上传 → 公开
# 版本号没变时第一步就会跳过，不会每次推送都重复构建。

on:
  # 每次推送到 main 都触发：是否真的发版由第一步读版本号决定。
  # 不按路径过滤——只改文档的推送也要能看到「已是最新版本，跳过」的结论，
  # 而不是让 Actions 页面看起来像根本没触发。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1 · 检查当前软件版本
  # ---------------------------------------------------------------------------
  version:
    name: 1 · 检查版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      publish: ${{ steps.read.outputs.publish }}
      draft-exists: ${{ steps.read.outputs.draft-exists }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号并判断是否需要发布
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')

          # tag、草稿标题与安装包名都由版本号推导，格式不对宁可停在第一步
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$'; then
            echo "::error::版本号 $VERSION 不符合 x.y.z 或 x.y.z-betaN，无法生成 tag 与安装包名"
            exit 1
          fi

          TAG="v$VERSION"
          STATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)

          DRAFT_EXISTS=false
          if [ "$STATE" = "false" ]; then
            echo "::notice::$TAG 已经发布过，本次不重复构建"
            PUBLISH=false
          else
            if [ "$STATE" = "true" ]; then
              # 上次构建中断留下的草稿：直接沿用，缺的资产由本轮补齐。
              # 这里不要去删草稿——草稿在发布前没有 tag 引用，--cleanup-tag 会因找不到 tag 而失败。
              echo "::warning::$TAG 存在未完成的草稿，本轮复用并补齐资产"
              DRAFT_EXISTS=true
            fi
            PUBLISH=true
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
            echo "draft-exists=$DRAFT_EXISTS"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2 · 确定 Release 与 tag（先草稿，构建完再公开，避免用户端查到半个版本）
  # ---------------------------------------------------------------------------
  tag:
    name: 2 · 建 tag 与草稿 Release
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4

      - name: 创建或复用草稿发布
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          DRAFT_EXISTS: ${{ needs.version.outputs.draft-exists }}
        run: |
          set -euo pipefail
          if [ "$DRAFT_EXISTS" = "true" ]; then
            echo "::notice::复用已有草稿 $TAG，缺少的资产由本轮构建补齐"
          else
            NOTES=$(awk -v ver="$VERSION" '
              index($0, "## [" ver "]") == 1 { inside = 1; next }
              inside && index($0, "## [") == 1 { exit }
              inside && /^\[[^]]+\]:/ { next }
              inside { print }
            ' CHANGELOG.md)

            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Collecout $VERSION" --draft --notes "$NOTES"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Collecout $VERSION" --draft --generate-notes
            fi
          fi

          echo "release-id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3 · 构建三平台压缩包并上传
  #   命名：Collecout-<版本>-<平台>-<架构>.zip（应用内检查更新按这个名字找资产）
  #   Windows / 安卓包里只有单个可执行文件，macOS 额外带解锁命令
  # ---------------------------------------------------------------------------
  build:
    name: 3 · 构建 ${{ matrix.name }}
    needs: [version, tag]
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: macOS arm64
            os: macos-latest
            platform: macos
          - name: Android 通用包
            os: ubuntu-latest
            platform: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'android'
        with:
          targets: ${{ matrix.platform == 'windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}

      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'android'
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          # Capacitor 7 的安卓模块按 Java 21 编译，JDK 17 会报「无效的源发行版：21」
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'

      - name: 安装依赖
        run: npm ci

      # ----- Windows：单文件免安装版 -----
      - name: 构建 Windows 可执行文件
        if: matrix.platform == 'windows'
        run: npm run tauri build -- --no-bundle

      - name: 打包 Windows（包内只有 Collecout.exe）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $candidates = @("src-tauri/target/release/Collecout.exe", "src-tauri/target/release/collecout.exe")
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "未找到 Windows 构建产物" }

          $stage = Join-Path $env:RUNNER_TEMP "stage-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # 可执行程序统一叫 Collecout.exe，包内不留任何其他文件
          Copy-Item $exe (Join-Path $stage "Collecout.exe") -Force

          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $zip = "dist-release/Collecout-${{ needs.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "Collecout.exe") -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          $names = @($archive.Entries | ForEach-Object { $_.FullName })
          $archive.Dispose()
          if ($names.Count -ne 1 -or $names[0] -ne "Collecout.exe") {
            throw "压缩包内容不符合约定：$($names -join ', ')"
          }

      # ----- macOS：.app + 解锁命令 -----
      - name: 构建 macOS 应用包
        if: matrix.platform == 'macos'
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: 打包 macOS（.app 与解锁命令）
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          # 包里带中文文件名：固定 UTF-8，日志里才能看到真实名字而不是问号
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          VERSION="${{ needs.version.outputs.version }}"
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Collecout.app"
          [ -d "$APP" ] || { echo "::error::没有找到 $APP"; exit 1; }

          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          cp "scripts/macos/解锁并打开.command" "$STAGE/"
          chmod +x "$STAGE/解锁并打开.command"

          mkdir -p dist-release
          ZIP="$PWD/dist-release/Collecout-${VERSION}-macos-arm64.zip"
          ( cd "$STAGE" && zip -qry "$ZIP" "Collecout.app" "解锁并打开.command" )

          # 校验靠解包后的文件系统，不比对 unzip 的文本输出：
          # 非 UTF-8 终端会把中文名转义，grep 中文串注定匹配不到（上一版就栽在这）
          CHECK=$(mktemp -d)
          ditto -x -k "$ZIP" "$CHECK"
          [ -d "$CHECK/Collecout.app" ] || { echo "::error::压缩包里没有 Collecout.app"; ls -la "$CHECK"; exit 1; }
          CMD_COUNT=$(find "$CHECK" -maxdepth 1 -name '*.command' | wc -l | tr -d ' ')
          if [ "$CMD_COUNT" != "1" ]; then
            echo "::error::压缩包里的解锁命令数量为 $CMD_COUNT（应为 1）"
            ls -la "$CHECK"
            exit 1
          fi

      # ----- Android：APK -----
      - name: 构建前端并同步安卓工程
        if: matrix.platform == 'android'
        run: |
          npm run build
          npx cap sync android

      - name: 解码签名证书
        if: matrix.platform == 'android' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/collecout.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/collecout.keystore" >> "$GITHUB_ENV"

      - name: 构建 APK
        if: matrix.platform == 'android'
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleRelease --no-daemon

      - name: 打包安卓（包内只有 Collecout.apk）
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          [ -n "$APK" ] || { echo "::error::没有找到 APK"; exit 1; }

          STAGE=$(mktemp -d)
          cp "$APK" "$STAGE/Collecout.apk"
          mkdir -p dist-release
          ZIP="$PWD/dist-release/Collecout-${VERSION}-android-universal.zip"
          ( cd "$STAGE" && zip -q "$ZIP" "Collecout.apk" )

          unzip -l "$ZIP" | grep -q "Collecout.apk" || { echo "::error::APK 没有进包"; exit 1; }

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist-release/*.zip --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------
  # 3 · 收尾：草稿转公开，预发布版本打上 Pre-Release 标记
  # ---------------------------------------------------------------------------
  publish:
    name: 3 · 公开 Release
    needs: [version, tag, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 草稿转公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.tag.outputs.release-id }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if printf '%s' "$VERSION" | grep -q -- '-beta'; then PRE=true; else PRE=false; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -X PATCH -F draft=false -F prerelease="$PRE"
          echo "::notice::Collecout $VERSION 已发布（pre-release=$PRE）"
