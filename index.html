<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>萃序 Collecout</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      /* 启动界面：内联样式保证首帧即显示，与安卓原生 splash 同为白底 + 居中 logo，衔接无跳变。
         logo 淡入用 easeOutExpo 类强减速曲线（先快后极缓地落定）；退场动画在 base.css
         （应用就绪后才发生，样式届时已加载）——那里按设置页「启动动画」预设提供四种退场。 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      #splash img {
        width: 76px;
        height: 76px;
        animation: splash-in 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon.svg" alt="" width="76" height="76" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
