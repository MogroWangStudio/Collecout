[package]
name = "collecout"
version = "1.5.0-beta1"
description = "萃序 Collecout —— 把 Word、Excel 和纯文本萃成结构化的信息库"
authors = ["MogroWang Studio"]
edition = "2021"

[lib]
name = "collecout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 应用内更新：下载发行包与双源测速。WebView 的 fetch 会被 GitHub 资产的 CORS 挡下，
# 只能走原生 HTTP；走系统 TLS（Windows schannel / macOS security-framework），
# 不需要额外编译 C 版 TLS 后端。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "http2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
